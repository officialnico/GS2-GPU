clone: 
  depth: 10
options:
  max-time: 20
pipelines:
  branches:
    next:
      - step:
          name: ubuntu-gfortran-8-O3
          image: 
            name: josephparker/gs2-dockerfiles:ubuntu-gfortran-8.2
            run-as-user: 1000
          script:
            - bash pipeline_test_scripts/test_script_ubuntu.sh
            - if [ $? -eq 0 ]; then bash <(curl -s https://codecov.io/bash) -t "a848e445-4d00-4aa9-8d00-e9950fcf29f2"; fi

stages:
  - test
  - ci_status
  - deploy

.report_pass: &report_pass
  - su -c "echo passed > ${JOB_STATUS_FILE}"

.typical_test_script: &typical_test_script
  - su -c "make ${EXTRA_FLAGS} test_make" theuser
  - su -c "whoami ; make ${EXTRA_FLAGS} build_pfunit_library || (echo 'build_pfunit_library_failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
  - su -c "whoami ; make ${EXTRA_FLAGS} -j tests || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
  - su -c "whoami ; make ${EXTRA_FLAGS} -j pfunit_tests || (cat pfunit.log; echo 'pfunit_tests_failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
  - pipeline_test_scripts/didTestsFail.sh ${PWD}/tests results_of_test.txt  || (echo "failed" > ${JOB_STATUS_FILE}; exit 1)
  - if [[ $(grep "FAILURES" pfunit.log | wc -l) -ge 1 ]] ; then echo "failed" > ${JOB_STATUS_FILE} ; exit 1 ; fi
  - su -c "echo passed > ${JOB_STATUS_FILE}"

.push_status: &push_status
  - BUILD_STATUS=$(cat ${JOB_STATUS_FILE})  BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
  
.init_test_job: &init_test_job
  - echo "running" > ${JOB_STATUS_FILE}
  - BUILD_STATUS=$(cat ${JOB_STATUS_FILE})  BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
  - echo "before_script" > ${JOB_STATUS_FILE}

.install_main_packages: &install_main_packages
    - apt-get update -qq && apt-get install -y -qq libfftw3-dev libnetcdf-dev libnetcdff-dev netcdf-bin openmpi-bin libopenmpi-dev gfortran cmake python3 python3-pip
    - pip3 install -r requirements.txt
  
variables:
  GIT_SUBMODULE_STRATEGY: recursive
  OMPI_MCA_rmaps_base_oversubscribe: "yes"
  # The following required to avoid lots of "Read -1, expected _, errno = 38" issues
  # Fix discussed at https://github.com/open-mpi/ompi/issues/4948, suggests newer mpi
  # and docker may avoid this issue
  OMPI_MCA_btl_vader_single_copy_mechanism: "none"
  JOB_STATUS_FILE: "special_file_to_indicate_job_status"
  MAKEFLAGS: "-IMakefiles"
  GK_SYSTEM: "bitbucket"
  
default:
  before_script:
    - *init_test_job
    - *install_main_packages
    - adduser theuser --disabled-password --gecos ""
    - chmod gou+rw ${JOB_STATUS_FILE}
  after_script:
    - echo "In the after script bit"
    - ls
    - echo $(cat ${JOB_STATUS_FILE})
    - *push_status 
  interruptible: true
    
formattting_tests:
  variables:
    CASENAME: "formatting"
  before_script:
    - *init_test_job
  script:
    - scripts/test_maximum_line_length $(scripts/get_all_matching_files.py --path=src --path=externals/utils --pattern="*.[Ff]??") || (echo "failed" > ${JOB_STATUS_FILE} ; exit 1)
    - *report_pass
    
standard_tests:
  variables:
    CASENAME: "standard"
    EXTRA_FLAGS: "USE_NEW_DIAG= "
  artifacts:
    paths:
      - pfunit.log
      - pfunit.error
      - ${JOB_STATUS_FILE}      
  script:
    - *typical_test_script
    
standard_tests_onestep:
  variables:
    CASENAME: "standard_one_step_pp"
    EXTRA_FLAGS: "USE_NEW_DIAG= ONE_STEP_PP=on"
  artifacts:
    paths:
      - pfunit.log
      - pfunit.error
      - ${JOB_STATUS_FILE}
  script:
    - su -c "whoami ; echo 'F90FLAGS += -ffree-form' > Makefile.local" theuser
    - *typical_test_script

nodeps_tests:
  variables:
    CASENAME: "no_dependency"
    EXTRA_FLAGS: "USE_FFT= USE_NETCDF= USE_MPI= USE_NEW_DIAG= "
  before_script:
    - *init_test_job
    - apt-get update -qq && apt-get install -y -qq gfortran    
    - adduser theuser --disabled-password --gecos ""
    - chmod gou+rw ${JOB_STATUS_FILE}
  script:
    - su -c "whoami ; make ${EXTRA_FLAGS} -j tests || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
    - pipeline_test_scripts/didTestsFail.sh ${PWD}/tests results_of_test.txt || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1)
    - *report_pass
  interruptible: true

pages:
  stage: test
  variables:
    EXTRA_FLAGS: "USE_NEW_DIAG= "
  script:
    - *install_main_packages
    - make ${EXTRA_FLAGS} doc
    - mv docs/html ./public
  artifacts:
    paths:
      - public
  only:
    - master
    - next
    - feature/expand_namelist_documentation
    
success:
  stage: ci_status
  before_script:
    - ""
  after_script:
    - ""
  script:
    - echo "All tests passed."
  when: on_success

failure:
  stage: ci_status
  before_script:
    - ""
  after_script:
    - ""
  script:
    - echo "At least one test failed."
  when: on_failure

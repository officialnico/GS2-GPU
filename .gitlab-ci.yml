stages:
  - test
  - ci_status
  - deploy

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  OMPI_MCA_rmaps_base_oversubscribe: "yes"
  # The following required to avoid lots of "Read -1, expected _, errno = 38" issues
  # Fix discussed at https://github.com/open-mpi/ompi/issues/4948, suggests newer mpi
  # and docker may avoid this issue
  OMPI_MCA_btl_vader_single_copy_mechanism: "none"
  
standard_tests:
  variables:
    CASENAME: "standard"
    JOB_STATUS_FILE: "special_file_to_indicate_job_status"
  artifacts:
    paths:
      - pfunit.log
      - pfunit.error
  before_script:
    - echo "before_script" > ${JOB_STATUS_FILE}
    - BUILD_STATUS=running BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
    - apt-get update -qq && apt-get install -y -qq libfftw3-dev libnetcdf-dev libnetcdff-dev netcdf-bin openmpi-bin libopenmpi-dev gfortran cmake python python-pip
    - pip install -r requirements.txt
    - adduser theuser --disabled-password --gecos ""
  script:
    - su -c "whoami ; MAKEFLAGS=-IMakefiles GK_SYSTEM=bitbucket make USE_NEW_DIAG= build_pfunit_library || (echo 'build_pfunit_library_failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
    - su -c "whoami ; MAKEFLAGS=-IMakefiles GK_SYSTEM=bitbucket make USE_NEW_DIAG= -j tests || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
    - su -c "whoami ; MAKEFLAGS=-IMakefiles GK_SYSTEM=bitbucket make USE_NEW_DIAG= -j pfunit_tests || (cat pfunit.log; echo 'pfunit_tests_failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
    - pipeline_test_scripts/didTestsFail.sh ${PWD}/tests results_of_test.txt  || (echo "failed" > ${JOB_STATUS_FILE}; exit 1)
    - echo "passed" > ${JOB_STATUS_FILE}
  after_script:
    - BUILD_STATUS=$(cat ${JOB_STATUS_FILE})  BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
  interruptible: true

standard_tests_onestep:
  variables:
    CASENAME: "standard_one_step_pp"
    JOB_STATUS_FILE: "special_file_to_indicate_job_status"
  artifacts:
    paths:
      - pfunit.log
      - pfunit.error
  before_script:
    - echo "before_script" > ${JOB_STATUS_FILE}
    - BUILD_STATUS=running BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
    - apt-get update -qq && apt-get install -y -qq libfftw3-dev libnetcdf-dev libnetcdff-dev netcdf-bin openmpi-bin libopenmpi-dev gfortran cmake python python-pip
    - pip install -r requirements.txt
    - adduser theuser --disabled-password --gecos ""
  script:
    - su -c "whoami ; MAKEFLAGS=-IMakefiles GK_SYSTEM=bitbucket make USE_NEW_DIAG= ONE_STEP_PP=on build_pfunit_library || (echo 'build_pfunit_library_failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
    - su -c "whoami ; echo 'F90FLAGS += -ffree-form' > Makefile.local ; MAKEFLAGS=-IMakefiles GK_SYSTEM=bitbucket make USE_NEW_DIAG= -j tests ONE_STEP_PP=on || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
    - su -c "whoami ; MAKEFLAGS=-IMakefiles GK_SYSTEM=bitbucket make USE_NEW_DIAG= -j pfunit_tests ONE_STEP_PP=on || (cat pfunit.log; echo 'pfunit_tests_failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
    - pipeline_test_scripts/didTestsFail.sh ${PWD}/tests results_of_test.txt  || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1)
    - echo "passed" > ${JOB_STATUS_FILE}
  after_script:
    - BUILD_STATUS=$(cat ${JOB_STATUS_FILE})  BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
  interruptible: true

nodeps_tests:
  variables:
    CASENAME: "no_dependency"
    JOB_STATUS_FILE: "special_file_to_indicate_job_status"
  before_script:
    - echo "before_script" > ${JOB_STATUS_FILE}
    - BUILD_STATUS=running  BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
    - apt-get update -qq && apt-get install -y -qq gfortran
    - adduser theuser --disabled-password --gecos ""
  script:
    - su -c "whoami ; MAKEFLAGS=-IMakefiles GK_SYSTEM=bitbucket make USE_FFT= USE_NETCDF= USE_MPI= USE_NEW_DIAG= -j tests || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
    - pipeline_test_scripts/didTestsFail.sh ${PWD}/tests results_of_test.txt || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1)
    - echo "passed" > ${JOB_STATUS_FILE}
  after_script:
    - BUILD_STATUS=$(cat ${JOB_STATUS_FILE})  BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
  interruptible: true

pages:
  stage: test
  script:
    - apt-get update -qq && apt-get install -y -qq libfftw3-dev libnetcdf-dev libnetcdff-dev netcdf-bin openmpi-bin libopenmpi-dev python python-pip gfortran
    - pip install -r requirements.txt
    - MAKEFLAGS=-IMakefiles GK_SYSTEM=bitbucket make USE_NEW_DIAG= doc
    - mv docs/html ./public
  artifacts:
    paths:
      - public
  only:
    - master
    - next
    - micro/landing-page

success:
  stage: ci_status
  before_script:
    - ""
  after_script:
    - ""
  script:
    - echo "All tests passed."
  when: on_success

failure:
  stage: ci_status
  before_script:
    - ""
  after_script:
    - ""
  script:
    - echo "At least one test failed."
  when: on_failure

stages:
  - test
  - ci_status
  - deploy

# Define reusable anchors. Note we can't refer to an anchored command
# in other anchors, so there's still some repetition.

.report_pass: &report_pass
  - su -c "echo passed > ${JOB_STATUS_FILE}" theuser

.typical_test_script: &typical_test_script
  - su -c "make ${EXTRA_BUILD_FLAGS} test_make" theuser
  - su -c "make ${EXTRA_BUILD_FLAGS} -j gs2 || (echo 'build_gs2_failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
  - if [ x${WITH_PFUNIT_TESTS} == "xyes" ] ; then su -c "whoami ; make ${EXTRA_BUILD_FLAGS} build_pfunit_library || (echo 'build_pfunit_library_failed' > ${JOB_STATUS_FILE}; exit 1) ; make ${EXTRA_BUILD_FLAGS} -j pfunit_tests || (cat pfunit.log; echo 'pfunit_tests_failed' > ${JOB_STATUS_FILE}; exit 1) ; if [[ $(grep 'FAILURES' pfunit.log | wc -l) -ge 1 ]] ; then echo 'failed' > ${JOB_STATUS_FILE} ; exit 1 ; fi "  theuser ; fi
  - if [ x${WITH_GS2_TESTS} == "xyes" ] ; then su -c "whoami ; make ${EXTRA_BUILD_FLAGS} -j tests || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1) ; pipeline_test_scripts/didTestsFail.sh ${PWD}/tests results_of_test.txt  || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1)" theuser ; fi
  - su -c "echo passed > ${JOB_STATUS_FILE}" theuser

.pfunit_tests: &pfunit_tests
  - if [ x${WITH_PFUNIT_TESTS} == "xyes" ] ; then su -c "whoami ; make ${EXTRA_BUILD_FLAGS} build_pfunit_library || (echo 'build_pfunit_library_failed' > ${JOB_STATUS_FILE}; exit 1) ; make ${EXTRA_BUILD_FLAGS} -j pfunit_tests || (cat pfunit.log; echo 'pfunit_tests_failed' > ${JOB_STATUS_FILE}; exit 1) ; if [[ $(grep 'FAILURES' pfunit.log | wc -l) -ge 1 ]] ; then echo 'failed' > ${JOB_STATUS_FILE} ; exit 1 ; fi "  theuser ; fi

.gs2_tests: &gs2_tests
  - if [ x${WITH_GS2_TESTS} == "xyes" ] ; then su -c "whoami ; make ${EXTRA_BUILD_FLAGS} -j tests || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1) ; pipeline_test_scripts/didTestsFail.sh ${PWD}/tests results_of_test.txt  || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1)" theuser ; fi

.push_status: &push_status
  - BUILD_STATUS=$(cat ${JOB_STATUS_FILE})  BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
  
.init_test_job: &init_test_job
  - echo "running" > ${JOB_STATUS_FILE}
  - BUILD_STATUS=$(cat ${JOB_STATUS_FILE})  BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
  - echo "before_script" > ${JOB_STATUS_FILE}

.install_main_packages: &install_main_packages
  - apt-get update -qq && apt-get install -y -qq ${GS2_PACKAGES}
  - if [ "x"${WITH_PYTHON} == "xyes" ]; then pip3 install -r requirements.txt; fi

.build_gs2: &build_gs2
  - su -c "make ${EXTRA_BUILD_FLAGS} -j gs2 || (echo 'build_gs2_failed' > ${JOB_STATUS_FILE}; exit 1)" theuser

.create_user: &create_user
  - adduser theuser --disabled-password --gecos ""
  - chmod gou+rw ${JOB_STATUS_FILE}
  
variables:
  GIT_SUBMODULE_STRATEGY: recursive
  OMPI_MCA_rmaps_base_oversubscribe: "yes"
  # The following required to avoid lots of "Read -1, expected _, errno = 38" issues
  # Fix discussed at https://github.com/open-mpi/ompi/issues/4948, suggests newer mpi
  # and docker may avoid this issue
  OMPI_MCA_btl_vader_single_copy_mechanism: "none"
  JOB_STATUS_FILE: "special_file_to_indicate_job_status"
  MAKEFLAGS: "-IMakefiles"
  GK_SYSTEM: "bitbucket"
  GS2_PACKAGES: "libfftw3-dev libnetcdf-dev libnetcdff-dev netcdf-bin openmpi-bin libopenmpi-dev gfortran cmake python3 python3-pip"
  WITH_PYTHON: "yes"
  WITH_PFUNIT_TESTS: "yes"
  WITH_GS2_TESTS: "yes"
  
default:
  artifacts:
    paths:
      - pfunit.log
      - pfunit.error
      - ${JOB_STATUS_FILE}
  before_script:
    - *init_test_job
    - *install_main_packages
    - *create_user
  after_script:
    - *push_status 
  interruptible: true
    
formattting_tests:
  variables:
    CASENAME: "formatting"
    GS2_PACKAGES: "python3"
    WITH_PYTHON: "no"
  script:
    - scripts/test_maximum_line_length $(scripts/get_all_matching_files.py --path=src --path=externals/utils --pattern="*.[Ff]??") || (echo "failed" > ${JOB_STATUS_FILE} ; exit 1)
    - *report_pass
    
standard_tests:
  variables:
    CASENAME: "standard"
    EXTRA_BUILD_FLAGS: "USE_NEW_DIAG= "
  script:
    - *typical_test_script
    
standard_tests_onestep:
  variables:
    CASENAME: "standard_one_step_pp"
    EXTRA_BUILD_FLAGS: "USE_NEW_DIAG= ONE_STEP_PP=on"
  script:
    - su -c "whoami ; echo 'F90FLAGS += -ffree-form' > Makefile.local" theuser
    - *typical_test_script

nodeps_tests:
  variables:
    CASENAME: "no_dependency"
    EXTRA_BUILD_FLAGS: "USE_FFT= USE_NETCDF= USE_MPI= USE_NEW_DIAG= "
    GS2_PACKAGES: "gfortran"
    WITH_PYTHON: "no"
    WITH_PFUNIT_TESTS: "no"
    WITH_GS2_TESTS: "yes"
  script:
    - *typical_test_script

pages:
  stage: test
  variables:
    EXTRA_BUILD_FLAGS: "USE_NEW_DIAG= "
    CASENAME: "website"
  script:
    - BUILD_STATUS=running  BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
    - *install_main_packages
    - make ${EXTRA_BUILD_FLAGS} doc
    - mv docs/html ./public
    - BUILD_STATUS=passed  BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
  after_script:
    - echo "Website created and pushed, it may take a while before the changes are reflected."
  artifacts:
    paths:
      - public

  rules:
    # Always build the website if the source branch name is master or next
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "next"'
      when: always
    # Always build the website if the commit message contains build-website      
    - if: '$CI_COMMIT_MESSAGE =~ /build-website/'
      when: always
    # Otherwise it's a manual action that can be triggered by an authenticated user on gitlab
    - when: manual
    
success:
  stage: ci_status
  before_script:
    - ""
  after_script:
    - ""
  script:
    - echo "All tests passed."
  when: on_success

failure:
  stage: ci_status
  before_script:
    - ""
  after_script:
    - ""
  script:
    - echo "At least one test failed."
  when: on_failure

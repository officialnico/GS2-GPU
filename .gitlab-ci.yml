stages:
  - test
  - ci_status

variables:
  GIT_SUBMODULE_STRATEGY: recursive

standard_tests:
  before_script:
    - apt-get update -qq && apt-get install -y -qq libfftw3-dev libnetcdf-dev libnetcdff-dev netcdf-bin openmpi-bin libopenmpi-dev gfortran
    - adduser --disabled-password --gecos "" theUser
    - su theUser
  script:
    - MAKEFLAGS=-IMakefiles GK_SYSTEM=bitbucket make USE_NEW_DIAG= -j tests
    
success:
  stage: ci_status
  before_script:
    - ""
  after_script:
    - ""
  script:
    - BUILD_STATUS=passed BUILD_KEY=push ./.push_gitlab_build_status
  when: on_success

failure:
  stage: ci_status
  before_script:
    - ""
  after_script:
    - ""
  script:
    - BUILD_STATUS=failed BUILD_KEY=push ./.push_gitlab_build_status
  when: on_failure

stages:
  - test
  - ci_status
  - deploy
  
variables:
  GIT_SUBMODULE_STRATEGY: recursive

standard_tests:
  before_script:
    - apt-get update -qq && apt-get install -y -qq libfftw3-dev libnetcdf-dev libnetcdff-dev netcdf-bin openmpi-bin libopenmpi-dev gfortran
    - adduser theuser --disabled-password --gecos ""
  script:
    - su -c "whoami ; MAKEFLAGS=-IMakefiles GK_SYSTEM=bitbucket make USE_NEW_DIAG= -j tests" theuser
    - pipeline_test_scripts/didTestsFail.sh ${PWD}/tests results_of_tests.txt
    
success:
  stage: ci_status
  before_script:
    - ""
  after_script:
    - ""
  script:
    - BUILD_STATUS=passed BUILD_KEY=push ./.push_gitlab_build_status
  when: on_success

failure:
  stage: ci_status
  before_script:
    - ""
  after_script:
    - ""
  script:
    - BUILD_STATUS=failed BUILD_KEY=push ./.push_gitlab_build_status
  when: on_failure


    
pages:
  stage: test
  script:
    - pip install ford
    - MAKEFLAGS=-IMakefiles GK_SYSTEM=bitbucket make USE_NEW_DIAG= docs
    - mv docs/html ./public
  artifacts:
    paths:
      - public
  

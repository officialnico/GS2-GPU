stages:
  - test
  - ci_status
  - deploy

# Define reusable anchors. Note we can't refer to an anchored command
# in other anchors, so there's still some repetition.

.report_pass: &report_pass
  - su -c "echo passed > ${JOB_STATUS_FILE}" theuser

.push_status: &push_status
  - BUILD_STATUS=$(cat ${JOB_STATUS_FILE})  BUILD_KEY=push ./pipeline_test_scripts/push_gitlab_build_status ${CASENAME}

.init_test_job: &init_test_job
  - echo "running" > ${JOB_STATUS_FILE}
  - BUILD_STATUS=$(cat ${JOB_STATUS_FILE})  BUILD_KEY=push ./pipeline_test_scripts/push_gitlab_build_status ${CASENAME}
  - echo "before_script" > ${JOB_STATUS_FILE}
  - cat /proc/cpuinfo

.install_main_packages: &install_main_packages
  - dnf install -y ${BASIC_PACKAGES} ${GS2_PACKAGES} ${EXTRA_PACKAGES}
  - if [ "x"${WITH_MPI} == "xyes" ]; then dnf install -y ${MPI_PACKAGES} ; source /etc/profile.d/modules.sh ; module load mpi ; echo 'MPI_LIB=' > Makefile.local ; fi #Note the MPI_LIB is needed until we namespace our Makefile variables
  - if [ "x"${GK_CI_PFUNIT} == "xON" ]; then dnf install -y ${PFUNIT_PACKAGES}

.install_python_packages: &install_python_packages
  - if [ "x"${WITH_PYTHON} == "xyes" ]; then dnf install -y ${PYTHON_PACKAGES} ; pip3 install uv ; uv venv pyenv && source pyenv/bin/activate && uv pip install -r requirements.txt; fi

.create_user: &create_user
  - useradd theuser
  - chown -R theuser /builds/gyrokinetics/gs2
  - chmod gou+rw ${JOB_STATUS_FILE}
  - touch Makefile.local
  - chmod gou+rw Makefile.local

variables: &default_variables
  GIT_SUBMODULE_STRATEGY: recursive
  OMPI_MCA_rmaps_base_oversubscribe: "yes"
  # The following required to avoid lots of "Read -1, expected _, errno = 38" issues
  # Fix discussed at https://github.com/open-mpi/ompi/issues/4948, suggests newer mpi
  # and docker may avoid this issue
  OMPI_MCA_btl_vader_single_copy_mechanism: "none"
  # The below would allow us to run as root and avoid having to create a
  # a new user to run as.
  # OMPI_ALLOW_RUN_AS_ROOT=1
  # OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
  # Below attempts to avoid issue on F39 https://github.com/open-mpi/ompi/issues/11295
  FI_PROVIDER: "tcp"
  MAKEFLAGS: "-IMakefiles"
  GK_SYSTEM: "fedora"
  # The following control what aspects of the test script are run
  GK_CI_BUILD: "ON"
  GK_CI_PFUNIT: "ON"
  GK_CI_INTEGRATED: "ON"
  # The following control some of the job setup and behaviour and can be
  # customised on a per job basis.
  EXTRA_MAKE_FLAGS: ""
  EXTRA_TEST_FLAGS: ""
  EXTRA_PFUNIT_FLAGS: ""
  GK_MAKEFILE_LOCAL_EXTRA_FLAGS: ""
  GK_BUILD_TARGET: "all"
  JOB_STATUS_FILE: "special_file_to_indicate_job_status"
  BASIC_PACKAGES: "environment-modules make git-core which findutils wget m4"
  PFUNIT_PACKAGES: "cmake"
  GS2_PACKAGES: "fftw-devel netcdf-fortran netcdf-devel netcdf-fortran-devel gcc gcc-gfortran"
  MPI_PACKAGES: "openmpi openmpi-devel"
  PYTHON_PACKAGES: "python python3 python3-devel python3-pip"
  EXTRA_PACKAGES: ""
  WITH_PYTHON: "yes"
  WITH_MPI: "yes"
  PKG_CACHE_DIR: "${CI_PROJECT_DIR}/cache"
  BUILD_PFUNIT_INSTALL_DIR: "${PKG_CACHE_DIR}/pfunit"
  BUILD_PFUNIT_JOBS: "1"
  PFUNIT_DIR: "${BUILD_PFUNIT_INSTALL_DIR}"
  BUILD_PFUNIT_IGNORE_GIT: "yes"
  PFUNIT_VERSION_MAJOR: "4"
  PFUNIT_EXTRA_CMAKE_FLAGS: -DCMAKE_Fortran_FLAGS_DEBUG='-fallow-argument-mismatch -g'

default:
  timeout: 20m
  artifacts:
    paths:
      - pfunit.log
      - pfunit.error
      - ${JOB_STATUS_FILE}
  before_script:
    - *init_test_job
    - *install_main_packages
    - *install_python_packages
    - *create_user
  after_script:
    - *push_status
  interruptible: true
  cache:
    paths:
      - cache
    key: "$CI_JOB_NAME-$CI_COMMIT_BRANCH"

.the_default_script: &default_script
  - su -c "./pipeline_test_scripts/ci_build_and_run.sh" theuser
  - *report_pass

formattting_tests:
  stage: test
  image: fedora:39
  variables:
    CASENAME: "formatting"
    GS2_PACKAGES: ""
    BASIC_PACKAGES: "which findutils git-core util-linux"
    WITH_PYTHON: "no"
    WITH_MPI: "no"
  script:
    - scripts/test_maximum_line_length $(scripts/get_all_matching_files.py --path=src --path=externals/utils --pattern="*.[Ff]??") || (echo "failed" > ${JOB_STATUS_FILE} ; exit 1)
    - ./scripts/config_generation.py --include-only --target-dir ./src/config_auto_gen || (echo "failed" > ${JOB_STATUS_FILE} ; exit 1)
    - git config --global --add safe.directory /builds/gyrokinetics/gs2
    - git diff --quiet || (echo "failed" > ${JOB_STATUS_FILE} ; exit 1) #This returns 1 if there are diffs
    - *report_pass
  cache: {}

standard_tests:
  stage: test
  image: fedora:39
  variables:
    CASENAME: "standard"
  script: *default_script

openmp_tests:
  stage: test
  image: fedora:39
  tags: [ saas-linux-medium-amd64 ]
  variables:
    CASENAME: "openmp"
    EXTRA_MAKE_FLAGS: "USE_OPENMP=on"
    GK_MAKEFILE_LOCAL_EXTRA_FLAGS: "F90FLAGS+=-std=f2008"
    OMP_NUM_THREADS: 2
  script: *default_script

gfortran14_mpich:
  stage: test
  image: fedora:40
  variables:
    CASENAME: "gfortran_14_mpich"
    MPI_PACKAGES: "mpich mpich-devel"
    EXTRA_PACKAGES: "openblas openblas-devel diffutils"
    GK_MAKEFILE_LOCAL_EXTRA_FLAGS: "F90FLAGS+=-std=f2008"
    EXTRA_MAKE_FLAGS: "USE_LAPACK=on LAPACK_LIB=-lopenblas WITH_EIG=on"
# MPICH performs very poorly when oversubscribed so we limit our integrated tests to
# one process only.
    EXTRA_TEST_FLAGS: "NTESTPROCS=1"
  script:
    - su -c "./pipeline_test_scripts/ci_fetch_and_build_petsc_and_slepc.sh -d ${PKG_CACHE_DIR}" theuser
    - su -c "source load_petsc_slepc ;  ./pipeline_test_scripts/ci_build_and_run.sh" theuser
    - *report_pass

gfortran9_standard_tests:
  stage: test
  image: fedora:31
  variables:
    CASENAME: "gfortran_9"
    WITH_PYTHON: ""
    GK_CI_PFUNIT: ""
    GK_CI_INTEGRATED: ""
    EXTRA_MAKE_FLAGS: "DEBUG=on"
  script: *default_script
  cache: {}

initialisation_tests:
  stage: test
  image: fedora:39
  variables:
    CASENAME: "ffpe_trap"
    EXTRA_MAKE_FLAGS: "TEST_LEVEL=2"
    GK_MAKEFILE_LOCAL_EXTRA_FLAGS: "F90FLAGS+=-ffpe-trap=invalid,zero -fcheck=all,no-array-temps -finit-real=snan -finit-integer=-12345 -finit-logical=true -finit-character=95 -finit-derived -g"
  script: *default_script

intel_tests:
  stage: test
  image: fedora:39
  artifacts:
  variables:
    CASENAME: "intel"
    EXTRA_MAKE_FLAGS: "COMPILER=ifx USE_FFT= USE_NETCDF= USE_MPI= USE_NEW_DIAG= "
    GK_MAKEFILE_LOCAL_EXTRA_FLAGS: "DBLESIZEOPT=-double_size 128\nF90FLAGS+=-stand f08 -warn stderror"
    GS2_PACKAGES: "cpp gcc"
    EXTRA_PACKAGES: "dnf-plugins-core"
    WITH_PYTHON: "no"
    WITH_MPI: "no"
    GK_CI_PFUNIT: ""
  script:
    - ./pipeline_test_scripts/ci_setup_intel_on_gitlab.sh -y
    - source load_intel_compiler
    - su -c "./pipeline_test_scripts/ci_build_and_run.sh" theuser
    - *report_pass
  cache: {}

coverage_standard_tests:
  stage: test
  image: fedora:39
  variables:
    CASENAME: "standard+coverage+debug"
    GK_CI_INTEGRATED: ""
    GK_CI_PFUNIT_COVERAGE: "ON"
    EXTRA_MAKE_FLAGS: "USE_GCOV=on DEBUG=on"
    COVERALLS_SERVICE_NAME: "gitlab-ci"
  script: *default_script
  after_script:
    - *push_status
    - time pip3 install git+https://github.com/d7919/cpp-coveralls.git
    - date
    - su -c "time coveralls --exclude tests --exclude ${PKG_CACHE_DIR} --exclude externals/pFUnit_build" theuser

parallel_netcdf_tests:
  stage: test
  image: fedora:39
  variables:
    CASENAME: "parallel_netcdf_no_compression"
    EXTRA_MAKE_FLAGS: "USE_NEW_DIAG= TEST_LEVEL=2 USE_PARALLEL_NETCDF=on USE_NETCDF_COMPRESSION= "
    EXTRA_PACKAGES: "netcdf-fortran-openmpi-devel"
  script: *default_script

nodeps_tests:
  stage: test
  image: fedora:39
  variables:
    CASENAME: "no_dependency"
    EXTRA_MAKE_FLAGS: "USE_FFT= USE_NETCDF= USE_MPI= USE_NEW_DIAG= "
    GS2_PACKAGES: "gfortran"
    WITH_PYTHON: "no"
    WITH_MPI: "no"
    GK_CI_PFUNIT: ""
  script: *default_script
  cache: {}

pages:
  stage: test
  image: fedora:39
  variables:
    CASENAME: "website"
  script:
    - BUILD_STATUS=running  BUILD_KEY=push ./pipeline_test_scripts/push_gitlab_build_status ${CASENAME}
    - *install_main_packages
    - *install_python_packages
    - su -c "make ${EXTRA_MAKE_FLAGS} doc" theuser
    - mv docs/html ./public
    - *report_pass
  after_script:
    - *push_status
    - echo "Website created and pushed, it may take a while before the changes are reflected."
  artifacts:
    paths:
      - public
  cache: {}
  rules:
    # Always build the website if the source branch name is master or next
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "next"'
      when: always
    # Always build the website if the commit message contains build-website
    - if: '$CI_COMMIT_MESSAGE =~ /build-website/'
      when: always
    # Otherwise it's a manual action that can be triggered by an authenticated user on gitlab
    - when: manual
      # Since gitlab 9 manual actions became blocking, which means that
      # the entire pipeline cannot complete until the manual action is triggered.
      # We need allow_failure true here to avoid this blocking the pipeline.
      allow_failure: true

stages:
  - test
  - ci_status

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  
simple_compile:
  before_script:
    - apt-get update -qq && apt-get install -y -qq libfftw3-dev libnetcdf-dev netcdf-bin openmpi-bin libopenmpi-dev gfortran
  script:
    - MAKEFLAGS=-IMakefiles GK_SYSTEM=bitbucket make submodules
    - ls Makefiles
    - MAKEFLAGS=-IMakefiles GK_SYSTEM=bitbucket make USE_NEW_DIAG= depend    
    - MAKEFLAGS=-IMakefiles GK_SYSTEM=bitbucket make USE_NEW_DIAG= -j gs2    

unit-tests:
  script:
    - echo "Success. Add your tests!"

success:
  stage: ci_status
  before_script:
    - ""
  after_script:
    - ""
  script:
    - BUILD_STATUS=passed BUILD_KEY=push ./.push_gitlab_build_status
  when: on_success

failure:
  stage: ci_status
  before_script:
    - ""
  after_script:
    - ""
  script:
    - BUILD_STATUS=failed BUILD_KEY=push ./.push_gitlab_build_status
  when: on_failure

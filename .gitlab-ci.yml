stages:
  - test
  - ci_status
  - deploy

default:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    OMPI_MCA_rmaps_base_oversubscribe: "yes"
    # The following required to avoid lots of "Read -1, expected _, errno = 38" issues
    # Fix discussed at https://github.com/open-mpi/ompi/issues/4948, suggests newer mpi
    # and docker may avoid this issue
    OMPI_MCA_btl_vader_single_copy_mechanism: "none"
    JOB_STATUS_FILE: "special_file_to_indicate_job_status"
    MAKEFLAGS: "-IMakefiles"
    GK_SYSTEM: "bitbucket"
  before_script:
    - echo "before_script" > ${JOB_STATUS_FILE}
    - BUILD_STATUS=running BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
    - apt-get update -qq && apt-get install -y -qq libfftw3-dev libnetcdf-dev libnetcdff-dev netcdf-bin openmpi-bin libopenmpi-dev gfortran cmake python3 python3-pip
    - pip3 install -r requirements.txt
    - adduser theuser --disabled-password --gecos ""
    - chmod gou+rw ${JOB_STATUS_FILE}
  script:
    - su -c "whoami ; make USE_NEW_DIAG= build_pfunit_library || (echo 'build_pfunit_library_failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
    - su -c "whoami ; make USE_NEW_DIAG= -j tests || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
    - su -c "whoami ; make USE_NEW_DIAG= -j pfunit_tests || (cat pfunit.log; echo 'pfunit_tests_failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
    - pipeline_test_scripts/didTestsFail.sh ${PWD}/tests results_of_test.txt  || (echo "failed" > ${JOB_STATUS_FILE}; exit 1)
    - if [[ $(grep "FAILURES" pfunit.log | wc -l) -ge 1 ]] ; then echo "failed" > ${JOB_STATUS_FILE} ; exit 1 ; fi
    - echo "passed" > ${JOB_STATUS_FILE}
SENAME}
  after_script:
    - echo "In the after script bit"
    - ls
    - echo $(cat ${JOB_STATUS_FILE})
    - BUILD_STATUS=$(cat ${JOB_STATUS_FILE})  BUILD_KEY=push ./.push_gitlab_build_status ${CA
  interruptible: true
    
formattting_tests:
  variables:
    CASENAME: "formatting"
  before_script:
    - BUILD_STATUS=running BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
  script:
    - scripts/test_maximum_line_length $(scripts/get_all_matching_files.py --path=src --path=externals/utils --pattern="*.[Ff]??") || (BUILD_STATUS=failed  BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}; exit 1)
    - BUILD_STATUS=passed  BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
  after_script:
    
standard_tests:
  variables:
    CASENAME: "standard"
  artifacts:
    paths:
      - pfunit.log
      - pfunit.error
      - ${JOB_STATUS_FILE}      

standard_tests_onestep:
  variables:
    CASENAME: "standard_one_step_pp"
    EXTRA_FLAGS: "USE_NEW_DIAG= ONE_STEP_PP=on"
  artifacts:
    paths:
      - pfunit.log
      - pfunit.error
      - ${JOB_STATUS_FILE}
  script:
    - su -c "whoami ; make ${EXTRA_FLAGS} build_pfunit_library || (echo 'build_pfunit_library_failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
    - su -c "whoami ; echo 'F90FLAGS += -ffree-form' > Makefile.local ; make ${EXTRA_FLAGS} -j tests || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
    - su -c "whoami ; make ${EXTRA_FLAGS} -j pfunit_tests || (cat pfunit.log; echo 'pfunit_tests_failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
    - pipeline_test_scripts/didTestsFail.sh ${PWD}/tests results_of_test.txt  || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1)
    - echo "passed" > ${JOB_STATUS_FILE}

nodeps_tests:
  variables:
    CASENAME: "no_dependency"
  before_script:
    - echo "before_script" > ${JOB_STATUS_FILE}
    - BUILD_STATUS=running  BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
    - apt-get update -qq && apt-get install -y -qq gfortran
    - adduser theuser --disabled-password --gecos ""
    - chmod gou+rw ${JOB_STATUS_FILE}
  script:
    - su -c "whoami ; make USE_FFT= USE_NETCDF= USE_MPI= USE_NEW_DIAG= -j tests || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1)" theuser
    - pipeline_test_scripts/didTestsFail.sh ${PWD}/tests results_of_test.txt || (echo 'failed' > ${JOB_STATUS_FILE}; exit 1)
    - echo "passed" > ${JOB_STATUS_FILE}
  after_script:
    - BUILD_STATUS=$(cat ${JOB_STATUS_FILE})  BUILD_KEY=push ./.push_gitlab_build_status ${CASENAME}
  interruptible: true

pages:
  stage: test
  script:
    - apt-get update -qq && apt-get install -y -qq libfftw3-dev libnetcdf-dev libnetcdff-dev netcdf-bin openmpi-bin libopenmpi-dev python3 python3-pip gfortran
    - pip3 install -r requirements.txt
    - MAKEFLAGS=-IMakefiles GK_SYSTEM=bitbucket make USE_NEW_DIAG= doc
    - mv docs/html ./public
  artifacts:
    paths:
      - public
  only:
    - master
    - next
    - micro/landing-page

success:
  stage: ci_status
  before_script:
    - ""
  after_script:
    - ""
  script:
    - echo "All tests passed."
  when: on_success

failure:
  stage: ci_status
  before_script:
    - ""
  after_script:
    - ""
  script:
    - echo "At least one test failed."
  when: on_failure

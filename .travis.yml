language: generic

addons:
  apt:
    packages: &gs2_packages
      - libfftw3-dev
      - libnetcdf-dev
      - libnetcdff-dev
      - netcdf-bin
      - openmpi-bin
      - libopenmpi-dev
      - gfortran
      - cmake
      - python3
      - python3-pip
os: linux
dist: xenial

env: &default_env
  GIT_SUBMODULE_STRATEGY: recursive
  OMPI_MCA_rmaps_base_oversubscribe: "yes"
  # The following required to avoid lots of "Read -1, expected _, errno = 38" issues
  # Fix discussed at https://github.com/open-mpi/ompi/issues/4948, suggests newer mpi
  # and docker may avoid this issue
  OMPI_MCA_btl_vader_single_copy_mechanism: "none"
  MAKEFLAGS: "-IMakefiles"
  GK_SYSTEM: "bitbucket"
  # The following control what aspects of the test script are run
  GK_TRAVIS_BUILD: "ON"
  GK_TRAVIS_PFUNIT: "ON"
  GK_TRAVIS_INTEGRATED: "ON"
  # The following control some of the job setup and behaviour and can be
  # customised on a per job basis.
  EXTRA_MAKE_FLAGS: ""
  EXTRA_TEST_FLAGS: ""

jobs:
  fast_finish: true
  include:
  - name: "Default"
    env:
      - *default_env
      - EXTRA_TEST_FLAGS="TEST_LEVEL=2 NTESTPROCS=6"
  - name: "No dependency build"
    env :
      - *default_env
      - EXTRA_MAKE_FLAGS="USE_MPI= USE_FFT= USE_NETCDF= USE_NEW_DIAG= "
      - GK_TRAVIS_PFUNIT=""
    addons:
      apt:
        packages:
          - gfortran
    before_install:
  - name: "Default + debug"
    env :
      - *default_env
      - EXTRA_MAKE_FLAGS="DEBUG=on"
  - name: "Default bionic (gfortran 7.5)"
    dist: bionic
  - name: "Default focal (gfortran 9.3)"
    dist: focal
  - name: "Intel - no dependencies"
    env:
      - *default_env
      - EXTRA_MAKE_FLAGS="QUIET= COMPILER=intel USE_MPI= USE_FFT= USE_NETCDF= USE_NEW_DIAG= "
      - GK_TRAVIS_PFUNIT=""
    install:
    - source /opt/intel/oneapi/compiler/latest/env/vars.sh
    addons:
      apt:
        sources:
        - sourceline: 'deb https://apt.repos.intel.com/oneapi all main'
          key_url: 'https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS-2023.PUB'
        packages:
          - python3
          - python3-pip
          - intel-oneapi-ifort
          - intel-basekit
          - intel-hpckit

    script:
      - source /opt/intel/oneapi/compiler/latest/env/vars.sh
      - . /opt/intel/oneapi/setvars.sh intel64
      - locate libimf.so
      - ./pipeline_test_scripts/travis_build.sh

before_install:
  - pip3 install --upgrade pip setuptools
  - pip3 install -r requirements.txt

script:
  - ./pipeline_test_scripts/travis_build.sh

language: generic

addons:
  apt:
    packages: &gs2_packages
      - libfftw3-dev
      - libnetcdf-dev
      - libnetcdff-dev
      - netcdf-bin
      - openmpi-bin
      - libopenmpi-dev
      - gfortran
      - cmake
      - python3
      - python3-pip

env: &default_env
  GIT_SUBMODULE_STRATEGY: recursive
  OMPI_MCA_rmaps_base_oversubscribe: "yes"
  # The following required to avoid lots of "Read -1, expected _, errno = 38" issues
  # Fix discussed at https://github.com/open-mpi/ompi/issues/4948, suggests newer mpi
  # and docker may avoid this issue
  OMPI_MCA_btl_vader_single_copy_mechanism: "none"
  MAKEFLAGS: "-IMakefiles"
  GK_SYSTEM: "bitbucket"
  # The following control some of the job setup and behaviour and can be
  # customised on a per job basis.
  EXTRA_MAKE_FLAGS : ""

.aliases:
  - &build_gs2
    make test_make ${EXTRA_MAKE_FLAGS}
    make -j gs2 ${EXTRA_MAKE_FLAGS}
  - &make_and_run_pfunit_tests
    - make build_pfunit_library ${EXTRA_MAKE_FLAGS}
    - make -j pfunit_tests ${EXTRA_MAKE_FLAGS}
  - &make_and_run_integrated_tests
    - make tests ${EXTRA_MAKE_FLAGS}
    - pipeline_test_scripts/didTestsFail.sh ${PWD}/tests results_of_test.txt

jobs:
  fast_finish: true
  include:
  - name: "Default"
  - name: "Default + debug"
    env :
      - *default_env
      - EXTRA_MAKE_FLAGS="DEBUG=on"

before_install:
  - pip3 install --upgrade pip setuptools
  - pip3 install -r requirements.txt

script:
  - *build_gs2
  - *make_and_run_pfunit_tests
  - *make_and_run_integrated_tests

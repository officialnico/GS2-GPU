[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gs2gpu"
version = "0.1.0"
description = "Faithful JAX (float64) time stepper for GS2, driven by the gs2_export Fortran front end"
requires-python = ">=3.11"
dependencies = ["jax>=0.7", "numpy>=1.26", "netCDF4>=1.6", "f90nml>=1.4"]

[project.optional-dependencies]
test = ["pytest>=8", "scipy>=1.11", "xarray>=2024.1"]

[project.scripts]
gs2gpu = "gs2gpu.cli:main"

[tool.setuptools.packages.find]
include = ["gs2gpu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
